name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint_and_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10']
        # Ubuntu 26.04 does not provide a Python 3.9 build.
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '8.0.1'
          $build = "ffmpeg-$version-essentials_build"
          $archive = Join-Path $env:RUNNER_TEMP "$build.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$version/$build.zip" `
            -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $expectedHash = 'e2aaeaa0fdbc397d4794828086424d4aaa2102cef1fb6874f6ffd29c0b88b673'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'FFmpeg archive SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "$build/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Check FFmpeg tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          # AutoCut imports moviepy.editor, which was removed in MoviePy 2.
          python -m pip install . "moviepy<2" pytest
      - name: Run Test
        run: python -m pytest test/
